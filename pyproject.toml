[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pharos-threshold-guardian"
version = "0.1.0"
description = "Pharos SkillEngine on-chain multi-condition decision engine for guarded execution"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "JimmyOgb" }
]
keywords = ["pharos", "agent", "skillengine", "decision-engine", "blockchain", "guardian"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
pharos-guardian = "guardian.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian*", "assets*"]
